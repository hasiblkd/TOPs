<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        function add(){
            var num1=document.getElementById("num1").value
            var num2=document.getElementById("num2").value

            var ans=document.getElementById("ans")

            ans.innerHTML=Number(num1)+Number(num2)
        }
        function sub(){
            var num1=document.getElementById("num1").value
            var num2=document.getElementById("num2").value

            var ans=document.getElementById("ans")

            ans.innerHTML=Number(num1)-Number(num2)
        }
        function mul(){
            var num1=document.getElementById("num1").value
            var num2=document.getElementById("num2").value

            var ans=document.getElementById("ans")

            ans.innerHTML=Number(num1)*Number(num2)
        }
        function div(){
            var num1=document.getElementById("num1").value
            var num2=document.getElementById("num2").value

            var ans=document.getElementById("ans")

            ans.innerHTML=Number(num1)/Number(num2)
        }


    </script> 



</head>
<body>

    <input type="text" id="num1"><br><br>
    <input type="text" id="num2"><br><br>
    <span id="ans"></span><br>

    <tr>
        <td>
            <th><button onclick="add()">Addition</button></th><br>
            <th><button onclick="sub()">Subtraction</button></th><br>
            <th><button onclick="mul()">Multiplication</button></th><br>
            <th><button onclick="div()">Division</button></th><br>
        </td>
    </tr>
    
</body>
</html>
