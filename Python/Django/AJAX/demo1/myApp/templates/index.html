<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script>

        $(document).ready(function(){
            display_country()
        })

        function test(){
            var q=$("#q").val()

            $.get('test',{q},function(rt){
                $("#result").html(rt)
            })
        }

        function display_country(){
            $.get("country",{}, function(rt){
                var options="<option> --- Select Country --- </option>"
                rt.data.map(ele =>{
                    options +=`<option value=${ele.id}>${ele.name}</option>`
                })
                $("#country").html(options)
            })
        }

        function display_state(cid){
            $.get("state",{cid}, function(rt){
                var options="<option> --- Select Country --- </option>"
                rt.data.map(ele =>{
                    options +=`<option value=${ele.id}>${ele.name}</option>`
                })
                $("#state").html(options)
            })
        }

        function display_city(sid){
            $.get("city",{sid}, function(rt){
                var options="<option> --- Select Country --- </option>"
                rt.data.map(ele =>{
                    options +=`<option value=${ele.id}>${ele.name}</option>`
                })
                $("#city").html(options)
            })
        }

        

    </script>

</head>
<body>

    <input type="text" name="" id="q"> 
    <button onclick="test()">Ok</button>
    <span id="result"></span>

    <br><br><br>

    <select name="country" id="country" onchange="display_state(value)">
        <option value="0">--- Select Country</option>
    </select>

    <select name="state" id="state" onchange="display_city(value)">
        <option value="0">--- Select State</option>
    </select>

    <select name="city" id="city">
        <option value="0">--- Select City</option>
    </select>
    
</body>
</html>
