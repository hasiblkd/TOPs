<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function(){
            display()
        })

        function register(){
            var name=$("#name").val()
            var price=$("#price").val()
            var qty=$("#qty").val()
            var brand=$("#brand").val()
            var csrfmiddlewaretoken=$('input[name="csrfmiddlewaretoken"]').val()

            $.post("register",{csrfmiddlewaretoken,name,price,qty,brand},function(rt){
                alert(rt)
                
            })

            reset()
            display()


        }

        function reset(){
            $("#name").val("")
            $("#price").val("")
            $("#qty").val("")
            $("#brand").val("")
        }

        function display(){
            $.get("display",{},function(rt){
                var rows=""
                rt.data.map(ele=>{
                    rows+=`
                    <tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.price}</td>
                        <td>${ele.qty}</td>
                        <td>${ele.brand}</td>

                        <td><Button class='btn btn-danger' onclick='delete_product(${ele.id})'>Delete</Button></td>
                    </tr>
                    `
                })
                $("#tdata").html(rows)
            })
        }
    </script>

    <style>

        body {
            background: #eef2ff;
            font-family: Arial, sans-serif;
        }

        .main-container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .heading {
            text-align: center;
            color: #312e81;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .card-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
            height: 100%;
        }

        .card-title {
            color: #4338ca;
            font-weight: 600;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e7ff;
            padding-bottom: 12px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn-register {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
        }

        .btn-register:hover {
            background: #3730a3;
            color: white;
        }

        .btn-reset {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
        }

        .btn-reset:hover {
            background: #d1d5db;
        }

        /* Table */

        .table-responsive {
            overflow-x: auto;
        }

        .table {
            min-width: 650px;
            margin-bottom: 0;
        }

        .table thead th {
            background: #4f46e5;
            color: white;
            padding: 12px;
            white-space: nowrap;
            text-align: center;
        }

        .table tbody td {
            padding: 12px;
            white-space: nowrap;
            text-align: center;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f5f3ff;
        }

        .brand {
            background: #ede9fe;
            color: #5b21b6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .price {
            color: #047857;
            font-weight: 600;
        }

        .qty {
            color: #1d4ed8;
            font-weight: 600;
        }

        .update-btn {
            background: #dbeafe;
            color: #1d4ed8;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            margin-right: 5px;
            font-size: 14px;
        }

        .update-btn:hover {
            background: #bfdbfe;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

    </style>

</head>


<body>

    <div class="container main-container">

        <!-- Heading -->

        <h2 class="heading">
            Product Management System
        </h2>


        <!-- Main Row -->

        <div class="row g-4">


            <!-- =========================
                 LEFT - REGISTRATION
            ========================== -->

            <div class="col-lg-5">

                <div class="card-box">

                    <h4 class="card-title">
                        Product Registration
                    </h4>

                    {% csrf_token %}

                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter product name"
                                   required
                                   id="name"
                                   >

                        </div>


                        <!-- Brand -->

                        <div class="mb-3">

                            <label class="form-label">
                                Brand Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter brand name"
                                   required
                                   id="brand"
                                   >

                        </div>


                        <!-- Price -->

                        <div class="mb-3">

                            <label class="form-label">
                                Price
                            </label>

                            <input type="number"
                                   class="form-control"
                                   placeholder="Enter price"
                                   required
                                   id="price"
                                   >

                        </div>


                        <!-- Quantity -->

                        <div class="mb-4">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   class="form-control"
                                   placeholder="Enter quantity"
                                   required
                                   id="qty"
                                   >

                        </div>


                        <!-- Buttons -->

                        <button 
                                class="btn-register me-2" onclick="register()">

                            Register

                        </button>


                        <button onclick="reset()"
                                class="btn-reset">

                            Reset

                        </button>

                    

                </div>

            </div>


            <!-- =========================
                 RIGHT - PRODUCT TABLE
            ========================== -->

            <div class="col-lg-7">

                <div class="card-box">

                    <h4 class="card-title">
                        Product List
                    </h4>


                    <div class="table-responsive">

                        <table class="table table-bordered table-hover">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Product</th>

                                    <th>Brand</th>

                                    <th>Price</th>

                                    <th>Qty</th>

                                    <th colspan="2">Action</th>

                                </tr>

                            </thead>


                            <tbody id="tdata">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
