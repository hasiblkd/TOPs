```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .registration-box {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .title {
            color: #5b21b6;
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-register {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-weight: bold;
        }

        .btn-register:hover {
            color: white;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="registration-box">

            <div class="text-center mb-4">

                <h2 class="title">
                    Student Registration
                </h2>

                <p class="text-muted">
                    Enter student information
                </p>

            </div>

            <!-- Success Message -->
            <div class="text-center mb-3">
                <span class="text-success">
                    {{ msg }}
                </span>
            </div>


            <!-- FORM -->
            <form method="POST" action="{% url 'register' %}">

                {% csrf_token %}


                <!-- Student Name -->
                <div class="mb-3">

                    <label for="student_name" class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="student_name"
                        name="student_name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>


                <!-- Age -->
                <div class="mb-4">

                    <label for="age" class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="age"
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        max="100"
                        required
                    >

                </div>


                <!-- Buttons -->
                <div class="d-grid gap-2">

                    <!-- Register Student -->
                    <button
                        type="submit"
                        class="btn btn-register"
                    >
                        Register Student
                    </button>


                    <!-- View Students -->
                    <a
                        href="{% url 'display' %}"
                        class="btn btn-success"
                    >
                        View Students
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
```
