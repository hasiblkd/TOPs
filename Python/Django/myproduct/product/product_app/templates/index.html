<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Registration</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            font-family: Arial, sans-serif;
        }


        /* Main Form Card */

        .main-card {
            max-width: 1100px;
            margin: 50px auto;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }


        /* Header */

        .form-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 40px;
        }


        .form-header-icon {
            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.18);

            border-radius: 18px;

            font-size: 32px;

            margin-bottom: 18px;
        }


        .form-header h2 {
            font-size: 32px;
            font-weight: bold;
        }


        .form-header p {
            margin: 0;
            opacity: 0.9;
        }


        /* Form Body */

        .form-body {
            padding: 45px;
        }


        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }


        /* Inputs */

        .form-control,
        .form-select {
            padding: 14px;
            border-radius: 10px;
        }


        .input-group-text {
            background: #f8fafc;
            color: #6366f1;
            padding-left: 18px;
            padding-right: 18px;
        }


        .form-control:focus,
        .form-select:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 0.2rem rgba(99, 102, 241, 0.12);
        }


        textarea.form-control {
            resize: none;
        }


        .required {
            color: red;
        }


        /* Buttons */

        .form-buttons {
            display: flex;
            gap: 15px;
        }


        .form-buttons .btn {
            flex: 1;

            padding: 14px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;
        }


        .btn-submit {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);

            border: none;

            color: white;
        }


        .btn-submit:hover {
            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.25);
        }


        /* Mobile */

        @media (max-width: 768px) {

            .main-card {
                margin: 20px 10px;
            }


            .form-header {
                padding: 30px;
            }


            .form-body {
                padding: 25px;
            }


            .form-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="main-card">


            <!-- Header -->

            <div class="form-header">

                <div class="form-header-icon">

                    <i class="bi bi-box-seam"></i>

                </div>


                <h2>
                    {% if pr %}
                        Update Product
                    {% else %}
                        Add New Product
                    {% endif %}
                </h2>


                <p>
                    Enter product information to add a new product to your inventory.
                </p>

            </div>



            <!-- Form Body -->

            <div class="form-body">


                <!-- Product Registration Form -->

                <form method="POST" action="{% url 'register' %}">

                    {% csrf_token %}


                    <!-- Product Name -->

                    <div class="mb-4">

                        <label class="form-label">

                            Product Name

                            <span class="required">*</span>

                        </label>


                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-box"></i>

                            </span>


                            <input
                                type="text"
                                name="product_name"
                                class="form-control"
                                placeholder="Enter product name"
                                required
                                value="{{pr.p_name}}"
                            >

                        </div>

                    </div>



                    <!-- Price and Quantity -->

                    <div class="row">


                        <!-- Price -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Product Price

                                <span class="required">*</span>

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">
                                    ₹
                                </span>


                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    placeholder="Enter product price"
                                    min="0"
                                    required
                                    value="{{pr.p_price}}"
                                >

                            </div>

                        </div>



                        <!-- Quantity -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Quantity

                                <span class="required">*</span>

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-stack"></i>

                                </span>


                                <input
                                    type="number"
                                    name="quantity"
                                    class="form-control"
                                    placeholder="Enter product quantity"
                                    min="1"
                                    required
                                    value="{{pr.p_qty}}"
                                >

                            </div>

                        </div>

                    </div>
<!-- Category -->

<div class="mb-4">

    <label class="form-label">

        Product Category

        <span class="required">*</span>

    </label>


    <div class="input-group">

        <span class="input-group-text">

            <i class="bi bi-grid"></i>

        </span>


        <select
            name="category"
            class="form-select"
            required
        >

            <option disabled>
                Select product category
            </option>


            <option
                value="Electronics"
                {% if pr.p_category == "Electronics" %}selected{% endif %}
            >
                Electronics
            </option>


            <option
                value="Clothing"
                {% if pr.p_category == "Clothing" %}selected{% endif %}
            >
                Clothing
            </option>


            <option
                value="Food & Beverages"
                {% if pr.p_category == "Food & Beverages" %}selected{% endif %}
            >
                Food & Beverages
            </option>


            <option
                value="Books"
                {% if pr.p_category == "Books" %}selected{% endif %}
            >
                Books
            </option>


            <option
                value="Furniture"
                {% if pr.p_category == "Furniture" %}selected{% endif %}
            >
                Furniture
            </option>


            <option
                value="Accessories"
                {% if pr.p_category == "Accessories" %}selected{% endif %}
            >
                Accessories
            </option>


            <option
                value="Other"
                {% if pr.p_category == "Other" %}selected{% endif %}
            >
                Other
            </option>

        </select>

    </div>

</div>
```




                    <!-- Description -->

                    <div class="mb-4">

                        <label class="form-label">

                            Product Description

                        </label>


                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Enter product description..."
                            
                        >{{ pr.p_desc }}</textarea>

                    </div>



                    <!-- Buttons -->

                    <div class="form-buttons">


                        <!-- 1. Register -->

                        <button
                            type="submit"
                            class="btn btn-submit"
                        >

                            <i class="bi bi-plus-circle me-2"></i>

                            {% if pr %}
                                Update
                            {% else %}
                                Register
                            {% endif %}

                        </button>



                        <!-- 2. Reset -->

                        <button
                            type="reset"
                            class="btn btn-outline-secondary"
                        >

                            <i class="bi bi-arrow-counterclockwise me-2"></i>

                            Reset

                        </button>



                        <!-- 3. View Products -->

                        <a
                            href="{%url 'display'%}"
                            class="btn btn-success"
                        >

                            <i class="bi bi-eye me-2"></i>

                            View Products

                        </a>


                    </div>


                </form>


            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
