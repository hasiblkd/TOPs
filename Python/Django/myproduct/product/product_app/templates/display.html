<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product List</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            font-family: Arial, sans-serif;
        }


        /* Main Card */

        .main-card {
            max-width: 1200px;
            margin: 50px auto;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }


        /* Header */

        .page-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 35px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }


        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }


        .header-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.18);

            border-radius: 17px;

            font-size: 30px;
        }


        .page-header h2 {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
        }


        .page-header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }


        /* Body */

        .table-body {
            padding: 40px;
        }


        /* Table */

        .table-container {
            overflow-x: auto;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
        }


        .table {
            margin: 0;
            min-width: 900px;
        }


        .table thead th {
            background: #f8fafc;
            color: #374151;
            font-weight: 700;
            padding: 17px 15px;
            border-bottom: 2px solid #e5e7eb;
            white-space: nowrap;
        }


        .table tbody td {
            padding: 17px 15px;
            vertical-align: middle;
            color: #4b5563;
        }


        .table tbody tr:hover {
            background: #f8faff;
        }


        /* Product Name */

        .product-name {
            font-weight: 600;
            color: #111827;
        }


        /* Category Badge */

        .category-badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }


        /* Price */

        .price {
            font-weight: 700;
            color: #059669;
        }


        /* Quantity */

        .quantity {
            font-weight: 600;
            color: #374151;
        }


        /* Register Button */

        .register-btn {
            background: white;
            color: #4f46e5;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: 600;
        }


        .register-btn:hover {
            background: #f3f4ff;
            color: #4338ca;
        }


        /* Mobile */

        @media (max-width: 768px) {

            .main-card {
                margin: 20px 10px;
            }


            .page-header {
                padding: 25px;
                flex-direction: column;
                align-items: flex-start;
            }


            .table-body {
                padding: 20px;
            }


            .page-header h2 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="main-card">


            <!-- Header -->

            <div class="page-header">


                <div class="header-content">

                    <div class="header-icon">

                        <i class="bi bi-box-seam"></i>

                    </div>


                    <div>

                        <h2>
                            Product List
                        </h2>

                        <p>
                            View all products in your inventory.
                        </p>

                    </div>

                </div>


                <!-- Register Button -->

                <a
                    href="{% url 'product' %}"
                    class="btn register-btn"
                >

                    <i class="bi bi-plus-circle me-2"></i>

                    Register Product

                </a>


            </div>



            <!-- Table Body -->

            <div class="table-body">


                <div class="table-container">


                    <table class="table table-hover">


                        <thead>

                            <tr>

                                <th>
                                    ID
                                </th>

                                <th>
                                    Product Name
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Quantity
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Description
                                </th>

                            </tr>

                        </thead>


                        <tbody>
                            {%  for product in products  %}
                            <tr>
                                <td>{{product.id}}</td>
                                <td>{{product.p_name}}</td>
                                <td>{{product.p_price}}</td>
                                <td>{{product.p_qty}}</td>
                                <td>{{product.p_category}}</td>
                                <td>{{product.p_desc}}</td>
                            </tr>
                            {% endfor %}
                        </tbody>


                    </table>


                </div>


            </div>


        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
